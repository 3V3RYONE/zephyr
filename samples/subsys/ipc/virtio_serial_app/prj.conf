# Zephyr configuration for VirtIO Serial Application on AM62x M4

# Enable logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

# Enable console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# OpenAMP and LibMetal support
CONFIG_OPENAMP=y
CONFIG_LIBMETAL=y

# Mailbox driver for IPC interrupts
CONFIG_MBOX=y

# Memory and heap configuration
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=2048

# System initialization
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Enable Assert
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2
